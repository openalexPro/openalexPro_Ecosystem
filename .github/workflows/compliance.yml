# Checks packages against STANDARD.md and publishes the reports on GitHub Pages.
#
# Daily at 00:00 UTC, and on demand. A repository/branch is checked only when its
# head commit, STANDARD.md or pkg/openalexStandard changed since its last check
# (compliance/state.json), unless `force` is set. Watched: the r-package rows of
# repos.tsv plus compliance/external.tsv. On demand, any `owner/name` can be
# checked, also one that is not watched.
#
# Needs: secret COMPLIANCE_READ_TOKEN (fine-grained, read-only contents + metadata on
# the org's repositories) for private repositories, and Settings -> Pages ->
# Source: GitHub Actions.
name: compliance

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      repo:
        description: "all, or owner/name (any repository, watched or not)"
        default: all
      ref:
        description: "branches (comma-separated), or a tag/commit for a one-off"
        default: main,dev
      force:
        description: "check even if nothing changed"
        type: boolean
        default: false

concurrency:
  group: compliance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          REPO: ${{ inputs.repo || 'all' }}
          REF: ${{ inputs.ref || 'main,dev' }}
          FORCE: ${{ inputs.force || false }}
          TOKEN: ${{ secrets.COMPLIANCE_READ_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          m=$(bash .github/scripts/compliance-plan.sh)
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
          echo "any=$(echo "$m" | jq '.include | length > 0')" >> "$GITHUB_OUTPUT"
          echo "$m" | jq -r '.include[] | "- \(.repo)@\(.branch) \(.commit[0:7])"' >> "$GITHUB_STEP_SUMMARY"

  check:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      GITHUB_PAT: ${{ secrets.COMPLIANCE_READ_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: eco
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.commit }}
          token: ${{ secrets.COMPLIANCE_READ_TOKEN || github.token }}
          path: target
      - name: Record the target
        run: |
          mkdir -p out
          jq -n --argjson t '${{ toJSON(matrix) }}' '$t' > out/target.json
          if [ -f target/DESCRIPTION ]; then echo "PKG=true" >> "$GITHUB_ENV"; else echo "PKG=false" >> "$GITHUB_ENV"; fi
      - uses: r-lib/actions/setup-r@v2
        if: env.PKG == 'true'
        with:
          use-public-rspm: true
          extra-repositories: https://openalexpro.r-universe.dev
      - uses: r-lib/actions/setup-r-dependencies@v2
        id: deps
        if: env.PKG == 'true'
        continue-on-error: true
        with:
          working-directory: target
          dependencies: '"hard"'
          extra-packages: |
            local::../eco/pkg/openalexStandard
            any::pkgload
            github::openalexPro/openalexAPI
          cache-version: compliance-1
      - name: Check
        id: check
        if: env.PKG == 'true' && steps.deps.outcome == 'success'
        continue-on-error: true
        env:
          REPO: ${{ matrix.repo }}
          BRANCH: ${{ matrix.branch }}
          COMMIT: ${{ matrix.commit }}
          PRIVATE: ${{ matrix.private }}
        shell: Rscript {0}
        run: |
          eco <- startsWith(Sys.getenv("REPO"), "openalexPro/")
          openalexStandard::compliance_report(
            "target", "out", redact = Sys.getenv("PRIVATE") == "true",
            repo = Sys.getenv("REPO"), ref = Sys.getenv("BRANCH"), commit = Sys.getenv("COMMIT"),
            manifest = if (eco) "eco/repos.tsv")
      - name: Report a failed check or a branch without a package
        if: always() && (env.PKG == 'false' || steps.check.outcome != 'success')
        env:
          REPO: ${{ matrix.repo }}
          BRANCH: ${{ matrix.branch }}
          COMMIT: ${{ matrix.commit }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPS: ${{ steps.deps.outcome }}
        run: |
          if [ "$PKG" = "false" ]; then why="no R package on this branch (no DESCRIPTION)"
          elif [ "$DEPS" != "success" ]; then why="the package or its dependencies could not be installed, see [the run log]($RUN)"
          else why="the check failed, see [the run log]($RUN)"; fi
          printf '# Compliance report: %s\n\n- **Branch:** %s %s\n- **Verdict:** error: %s\n' "$REPO" "$BRANCH" "${COMMIT:0:7}" "$why" > out/report.md
          cp out/report.md out/report_public.md
          jq -n --arg why "$why" '{meta: {verdict: "error", note: $why}}' > out/report.json
          cp out/report.json out/report_public.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ matrix.id }}
          path: out/
          retention-days: 90

  publish:
    needs: [plan, check]
    if: always() && needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: report-*
          path: artifacts
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install openalexStandard
        run: |
          Rscript -e 'install.packages(c("DBI", "duckdb", "jsonlite"))'
          R CMD INSTALL pkg/openalexStandard
      - name: Publish the reports
        shell: Rscript {0}
        run: openalexStandard::compliance_publish("artifacts", "compliance")
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compliance
          if git diff --cached --quiet; then echo "No report changed."; exit 0; fi
          git commit -m "compliance: $(ls artifacts | sed 's/^report-//' | paste -sd ' ' -)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./compliance
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3
      - id: deploy
        uses: actions/deploy-pages@v4
